<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="rubyGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)"/>

  <!-- Outer Aegis Shield -->
  <polygon points="256,36 446,116 386,396 256,486 126,396 66,116"
           fill="url(#shieldGrad)"
           stroke="url(#goldBorder)"
           stroke-width="16"
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Inner Trim & Carvings -->
  <polygon points="256,66 416,134 366,374 256,450 146,374 96,134"
           fill="none"
           stroke="#78350f"
           stroke-width="6"
           stroke-linejoin="round"
           opacity="0.8"/>

  <!-- Aegis Center Emblem / Core (Red Ruby Core) -->
  <polygon points="256,150 336,210 306,320 256,350 206,320 176,210"
           fill="url(#rubyGlow)"
           stroke="url(#goldBorder)"
           stroke-width="8"
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Plus (+) Symbol in Core (Aegis PLUS) -->
  <rect x="244" y="215" width="24" height="70" rx="4" fill="#ffffff" filter="url(#glow)"/>
  <rect x="221" y="238" width="70" height="24" rx="4" fill="#ffffff" filter="url(#glow)"/>

  <!-- Accents / Rune Rays -->
  <path d="M 256,66 L 256,150 M 96,134 L 176,210 M 416,134 L 336,210 M 146,374 L 206,320 M 366,374 L 306,320 M 256,350 L 256,450"
        stroke="url(#goldBorder)"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.75"/>
</svg>
